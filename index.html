<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .shortener-card {
      background-color: hsl(255, 11%, 22%);
      padding: 20px;
      border-radius: 10px;
      background-image: url('./images/bg-shorten-desktop.svg');
      background-size: cover;
    }

    .btn-shorten {
      background-color: hsl(180, 66%, 49%);
      color: white;
      border-radius: 20px;
    }

    .btn-shorten:hover {
      background-color: hsl(180, 70%, 43%);
    }

    #hoverResult {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 999;
      width: 80%;
      max-width: 500px;
      text-align: center;
    }

    #hoverResult a {
      color: #007bff;
      word-break: break-word;
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="container mt-5">
    <div class="shortener-card position-relative">
      <form class="d-flex" id="shortenForm">
        <input type="text" class="form-control me-2" id="urlInput" placeholder="Shorten a link here...">
        <button type="submit" class="btn btn-shorten">Shorten It!</button>
      </form>
      <div id="hoverResult">
        <p class="mb-2">Your shortened URL:</p>
        <a href="#" target="_blank" id="shortenedUrl"></a>
        <button class="btn btn-sm btn-outline-secondary" id="shortenAnother">Shorten Another URL</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('shortenForm');
    const urlInput = document.getElementById('urlInput');
    const hoverResult = document.getElementById('hoverResult');
    const shortenedUrl = document.getElementById('shortenedUrl');
    const shortenAnother = document.getElementById('shortenAnother');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const originalUrl = urlInput.value.trim();
      if (!originalUrl) return;

      // Simulate a shortened URL (you would use an API call here)
      const fakeShortUrl = 'https://short.ly/' + btoa(originalUrl).slice(0, 6);

      shortenedUrl.href = fakeShortUrl;
      shortenedUrl.textContent = fakeShortUrl;
      hoverResult.style.display = 'block';
    });

    shortenAnother.addEventListener('click', () => {
      hoverResult.style.display = 'none';
      urlInput.value = '';
      urlInput.focus();
    });
  </script>
</body>

</html>
