<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      color: white;
      height: 100vh;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.8);
      border: none;
      border-radius: 1rem;
    }

    .form-control, .btn {
      border-radius: 0.5rem;
    }

    #result-section {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container h-100 d-flex justify-content-center align-items-center">
    <div class="row w-100">
      <div class="col-lg-6 mx-auto">
        <div class="card shadow-lg p-4">
          <h1 class="text-center mb-4">Shorten Your URL</h1>
          <form id="urlForm">
            <div class="mb-3">
              <input
                type="url"
                id="longUrl"
                class="form-control"
                placeholder="Enter long URL"
                required
              />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Shorten It!</button>
            </div>
          </form>

          <div id="result-section" class="text-center mt-4">
            <h5>Your Shortened URL:</h5>
            <p id="shortUrl" class="fw-bold text-info"></p>
            <button id="resetBtn" class="btn btn-outline-light mt-2">Shorten Another</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("urlForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const longUrl = document.getElementById("longUrl").value;
      const shortUrl = "https://short.ly/" + Math.random().toString(36).substring(2, 8); // Simulación

      document.getElementById("shortUrl").textContent = shortUrl;
      document.getElementById("urlForm").style.display = "none";
      document.getElementById("result-section").style.display = "block";
    });

    document.getElementById("resetBtn").addEventListener("click", function () {
      document.getElementById("urlForm").style.display = "block";
      document.getElementById("result-section").style.display = "none";
      document.getElementById("longUrl").value = "";
    });
  </script>
</body>
</html>
